<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Gate Confusion Matrix">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="34" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Gate Confusion Matrix</text>
  <text x="34" y="68" font-family="Arial, sans-serif" font-size="14" fill="#526174">For Agent + content_source gate: catches 3/3 anomalies and blocks 0/105 normal human posts.</text>
  <text x="461.25" y="108" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174">blocked by gate</text><text x="923.75" y="108" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174">allowed by gate</text><text x="220" y="181.5" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="end" fill="#526174">actual anomaly</text><rect x="231" y="121" width="460.5" height="113" fill="#20865a" opacity="0.30198591479439074" stroke="#d8e1ec"/><text x="461.25" y="181.5" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" font-weight="700" fill="#172033">3</text><rect x="693.5" y="121" width="460.5" height="113" fill="#f4f7fb" opacity="1" stroke="#d8e1ec"/><text x="220" y="296.5" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="end" fill="#526174">normal human post</text><rect x="231" y="236" width="460.5" height="113" fill="#f4f7fb" opacity="1" stroke="#d8e1ec"/><rect x="693.5" y="236" width="460.5" height="113" fill="#20865a" opacity="1" stroke="#d8e1ec"/><text x="923.75" y="296.5" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" font-weight="700" fill="#fff">105</text><text x="230" y="392" font-family="Arial, sans-serif" font-size="12" fill="#172033" fill="#7a8797">lighter = lower / blank = zero</text><text x="1155" y="392" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="end" fill="#7a8797">max 105</text>
</svg>