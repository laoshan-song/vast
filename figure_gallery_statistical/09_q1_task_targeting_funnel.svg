<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Task-Driven Targeting Funnel">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="34" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Task-Driven Targeting Funnel</text>
  <text x="34" y="68" font-family="Arial, sans-serif" font-size="14" fill="#526174">How Q1 narrows the full event log to the target anomalous SaidIt post.</text>
  <text x="46" y="92" font-family="Arial, sans-serif" font-size="12" fill="#172033" fill="#526174" font-size="13">Filter is task-driven: the challenge gives SaidIt, John Windward, and the May 17 04:21 target time.</text><rect x="220" y="116" width="760" height="42" fill="#9aa6b2" rx="6" opacity="0.45"/><text x="600" y="143" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">all log events: 185,147</text><text x="600" y="178" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174" font-size="12">start from the provided event log</text><path d="M588,165 L600,178 L612,165" fill="none" stroke="#d8e1ec" stroke-width="2"/><rect x="379.43446109230246" y="198" width="441.1310778153951" height="42" fill="#256fb8" rx="6" opacity="0.88"/><text x="600" y="225" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">SaidIt posts: 108</text><text x="600" y="260" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174" font-size="12">official clue names SaidIt as the posting platform</text><path d="M588,247 L600,260 L612,247" fill="none" stroke="#d8e1ec" stroke-width="2"/><rect x="450.2828604890243" y="280" width="299.43427902195145" height="42" fill="#c93b45" rx="6" opacity="0.88"/><text x="600" y="307" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">Agent file-source posts: 3</text><text x="600" y="342" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174" font-size="12">abnormal posts use content_source instead of ordinary content</text><path d="M588,329 L600,342 L612,329" fill="none" stroke="#d8e1ec" stroke-width="2"/><rect x="465.1414302445121" y="362" width="269.71713951097576" height="42" fill="#20865a" rx="6" opacity="0.88"/><text x="600" y="389" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">target SwiftWren post: 1</text><text x="600" y="424" font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle" fill="#526174" font-size="12">John Windward + May 17 04:21 identifies the message of interest</text><text x="46" y="526" font-family="Arial, sans-serif" font-size="12" fill="#172033" fill="#7a8797" font-size="12">Bar width uses log10(count + 1), so the 185,147-to-1 narrowing remains readable without hiding the counts.</text>
</svg>