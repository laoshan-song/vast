const nodePos={};
// Left column: core operators
[{id:"gabriel_sonar",x:130,y:100},{id:"emma_harbor",x:130,y:250},{id:"zoey_drydock",x:130,y:400}].forEach(d=>nodePos[d.id]=d);
// Left-center: puppets
[{id:"chloe_ballast",x:290,y:160},{id:"noah_mariner",x:290,y:340}].forEach(d=>nodePos[d.id]=d);
// Middle columns: blind forwarders (3 cols × 5 rows in a clean grid)
const blinds=N.filter(n=>n.r==="blind");
blinds.forEach((n,i)=>{
  const col=i%3,row=Math.floor(i/3);
  nodePos[n.id]={x:430+col*150,y:50+row*90};
});
// Right: endpoint
nodePos["john_windward"]={x:920,y:250};
// Assign to nodes
N.forEach(n=>{const p=nodePos[n.id];n.x=p.x;n.y=p.y;});

// ===== D3 RENDER =====
const W=window.innerWidth,H=window.innerHeight;
const svg=d3.select("#graph"),G=svg.append("g");
const defs=svg.append("defs");

// Arrow markers
Object.entries(CHAINS).forEach(([nm,c])=>{
  defs.append("marker").attr("id","ma-"+nm).attr("viewBox","0 0 10 10").attr("refX",16).attr("refY",5)
    .attr("markerWidth",4).attr("markerHeight",4).attr("orient","auto")
    .append("path").attr("d","M0 0L10 5L0 10z").attr("fill",c.cl).attr("opacity",0.4);
});

// Glow for John
const gf=defs.append("filter").attr("id","glow").attr("x","-60%").attr("y","-60%").attr("width","220%").attr("height","220%");
gf.append("feGaussianBlur").attr("stdDeviation",4).attr("result","b");
gf.append("feMerge").selectAll("feMergeNode").data(["b","SourceGraphic"]).enter().append("feMergeNode").attr("in",d=>d);

// Dept colors for subtle grouping
const deptColors={"Products":"#1a3a2a","IT":"#1a2a3a","Exec":"#1a1a2a","Support":"#2a1a1a","HR":"#2a2a1a","Unknown":"#1a1a1a"};
// Dept label backgrounds
N.forEach(n=>{
  if(!nodePos[n.id])return;
  const p=nodePos[n.id];
  G.append("rect").attr("x",p.x-8).attr("y",nodePos[n.id].y-8).attr("width",16).attr("height",16).attr("rx",3)
    .attr("fill",deptColors[n.dp]||"#1a1a1a").attr("stroke","rgba(255,255,255,0.03)").attr("opacity",0.5);
});

// Edges (initially dim)
const allEdges=[];
Object.entries(CHAINS).forEach(([nm,c])=>{
  c.ue.forEach(e=>allEdges.push({source:e[0],target:e[1],chain:nm,color:c.cl,w:e[2]}));
});

const edgeG=G.append("g");
const linkEls=edgeG.selectAll("line").data(allEdges).enter().append("line")
  .attr("x1",d=>N.find(n=>n.id===d.source)?.x).attr("y1",d=>N.find(n=>n.id===d.source)?.y)
  .attr("x2",d=>N.find(n=>n.id===d.target)?.x).attr("y2",d=>N.find(n=>n.id===d.target)?.y)
  .attr("stroke",d=>d.color+"22").attr("stroke-width",d=>0.8+Math.log(d.w+1)*1.2)
  .attr("marker-end",d=>'url(#ma-'+d.chain+')');

// Self-loop arcs
const selfG=G.append("g");
allEdges.filter(e=>e.source===e.target).forEach(e=>{
  const n=N.find(x=>x.id===e.source);if(!n)return;
  selfG.append("path").attr("d",`M${n.x+10},${n.y-10}A20,20 0 1,1 ${n.x+12},${n.y-10}`).attr("fill","none")
    .attr("stroke",e.color+"33").attr("stroke-width",1).attr("stroke-dasharray","2,3");
});

// Nodes
const R={blind:12,puppet:16,core:22,endpoint:28};
const RC={blind:"#58a6ff",puppet:"#d29922",core:"#a371f7",endpoint:"#f85149"};
const nodeG=G.append("g");

N.forEach(n=>{
  if(!nodePos[n.id])return;
  const g=nodeG.append("g").attr("transform",`translate(${n.x},${n.y})`).attr("cursor","pointer");
  // Glow ring for endpoint
  if(n.r==="endpoint"){
    g.append("circle").attr("r",R[n.r]+10).attr("fill","none").attr("stroke","#f85149").attr("stroke-width",2.5).attr("stroke-opacity",0.3).attr("filter","url(#glow)");
  }
  // Main circle
  g.append("circle").attr("r",R[n.r]).attr("fill",RC[n.r]).attr("stroke","#fff").attr("stroke-width",1.5).attr("stroke-opacity",0.2);
  // Label
  const name=n.nm.split(" ").pop();
  g.append("text").text(name).attr("dy",R[n.r]+13).attr("text-anchor","middle").attr("fill","#8b949e").attr("font-size",n.r==="core"||n.r==="endpoint"?11:9).attr("font-weight",n.r==="core"||n.r==="endpoint"?600:400);
  // Dept subtitle
  g.append("text").text(n.dp).attr("dy",R[n.r]+23).attr("text-anchor","middle").attr("fill","#555").attr("font-size",7);
});

// Top labels
G.append("text").attr("x",130).attr("y",20).attr("text-anchor","middle").attr("fill","#a371f7").attr("font-size",10).attr("font-weight",600).text("SOURCES");
G.append("text").attr("x",580).attr("y",20).attr("text-anchor","middle").attr("fill","#58a6ff").attr("font-size",10).attr("font-weight",600).text("BLIND FORWARDING FABRIC");
G.append("text").attr("x",920).attr("y",20).attr("text-anchor","middle").attr("fill","#f85149").attr("font-size",10).attr("font-weight",600).text("ENDPOINT");

// ===== CHAIN SELECTION =====
let ac=null,rafId=null,timer=null,stopped=false;

function hl(cn){
  edgeG.selectAll("line").attr("display",l=>l.chain===cn?null:"none");
  selfG.selectAll("path").attr("display",function(){const e=d3.select(this).datum();return e&&e.chain===cn?null:"none";});
  const sn=new Set();CHAINS[cn].ue.forEach(e=>{sn.add(e[0]);sn.add(e[1]);});
  nodeG.selectAll("g").attr("opacity",function(){const d=this.__data__;return sn.has(d.id)?1:0.08;});
}

function sel(cn){
  if(ac===cn)return;
  stopped=true;if(rafId)cancelAnimationFrame(rafId);if(timer)clearTimeout(timer);
  document.querySelectorAll(".btn").forEach(b=>b.classList.remove("on"));
  document.getElementById("b"+cn.substring(0,2).toLowerCase()).classList.add("on");
  ac=cn;stopped=false;
  hl(cn);
  const c=CHAINS[cn];
  document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${cn}</b><br>${c.desc}<br>8s · ${c.total} hops`;
  run();
}

function run(){
  if(!ac||stopped)return;
  const c=CHAINS[ac];const totalMs=8000;
  const path=c.hops.map(([s,t])=>{
    const src=N.find(n=>n.id===s),dst=N.find(n=>n.id===t);
    return {sx:src?.x||0,sy:src?.y||0,tx:dst?.x||0,ty:dst?.y||0,self:s===t,tId:t};
  });
  G.selectAll(".particle").remove();
  const p=G.append("circle").attr("class","particle").attr("r",5).attr("fill",c.cl).attr("opacity",0.9).attr("filter","url(#glow)").attr("cx",path[0].sx).attr("cy",path[0].sy);
  const st=performance.now();
  (function frame(){
    if(stopped)return;
    const el=performance.now()-st,prog=Math.min(el/totalMs,1);
    const raw=prog*c.total,idx=Math.min(Math.floor(raw),c.total-1),hp=raw-idx;
    const seg=path[idx];
    if(seg&&!seg.self){p.attr("cx",seg.sx+(seg.tx-seg.sx)*hp).attr("cy",seg.sy+(seg.ty-seg.sy)*hp);}
    else if(seg){p.attr("cx",seg.sx).attr("cy",seg.sy);}
    document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${ac}</b><br>${idx+1}/${c.total} → ${seg?N.find(n=>n.id===seg.tId)?.nm.split(' ').pop():''}`;
    if(prog>=1){document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${ac}</b><br>✓ Posted to SaidIt`;timer=setTimeout(run,2500);return;}
    rafId=requestAnimationFrame(frame);
  })();
  rafId=requestAnimationFrame(frame);
}

// ===== TOOLTIP =====
const tip=d3.select("#tip");
nodeG.selectAll("g").on("mouseenter",function(e,d){
  const con=new Set();allEdges.forEach(l=>{if(l.source===d.id||l.target===d.id){con.add(l.source);con.add(l.target);}});con.add(d.id);
  if(!ac){edgeG.selectAll("line").attr("stroke-opacity",l=>con.has(l.source)&&con.has(l.target)?0.6:0.02);}
  tip.style("opacity",1).html(`<div class="nm" style="color:${RC[d.r]}">${d.nm}</div><div class="dp">${d.dp}</div><span class="tag" style="background:${RC[d.r]}18;color:${RC[d.r]};border:1px solid ${RC[d.r]}33">${d.r==="endpoint"?"Post Endpoint":d.r==="core"?"Core Operator":d.r==="puppet"?"Puppet":"Blind Forwarder"}</span>`);
}).on("mousemove",e=>tip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-10)+"px"))
  .on("mouseleave",()=>{if(!ac){edgeG.selectAll("line").attr("stroke-opacity",0.25);}tip.style("opacity",0);});

// Edge hover → show event detail
const etip=d3.select("#etip");
edgeG.selectAll("line").on("mouseenter",function(e,d){
  if(ac&&d.chain!==ac)return;
  etip.style("opacity",1).html(`<b style="color:${d.color}">${d.chain}</b><br>${d.source} → ${d.target}<br>Weight: ${d.w}`);
}).on("mousemove",e=>etip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-10)+"px"))
  .on("mouseleave",()=>etip.style("opacity",0));

// Center
svg.call(d3.zoom().translateExtent([[0,0],[W,H]]).scaleExtent([0.5,2]).on("zoom",e=>G.attr("transform",e.transform)));
const cx=(nodePos["gabriel_sonar"].x+nodePos["john_windward"].x)/2;
const cy=H/2;
svg.call(d3.zoom().transform,d3.zoomIdentity.translate(W/2-cx,H/2-cy));
</script>
</body>
</html>
