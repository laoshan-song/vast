fender","chloe_ballast",1],["chloe_ballast","david_breakwater",1],["david_breakwater","liam_anchor",1],["liam_anchor","daniel_gangway",1],["daniel_gangway","owen_hatch",1],["owen_hatch","olivia_keel",1],["olivia_keel","chloe_ballast",1],["chloe_ballast","levi_signal",1],["levi_signal","henry_sail",1],["henry_sail","michael_capstan",1],["michael_capstan","mia_fender",1],["olivia_keel","olivia_keel",1],["henry_sail","henry_sail",1],["liam_anchor","liam_anchor",1],["evelyn_dock","evelyn_dock",1],["lily_anchorline","lily_anchorline",1],["chloe_ballast","chloe_ballast",1],["mia_fender","mia_fender",1],["gabriel_sonar","gabriel_sonar",1],["evelyn_dock","evelyn_dock",1],["john_windward","john_windward",1]]},"MellowOtter":{"cl":"#fbbf24","desc":"定时触发 · 10跳 · 11人",total:10,hops:[["noah_mariner","liam_anchor"],["liam_anchor","henry_sail"],["henry_sail","james_stern"],["james_stern","daniel_gangway"],["daniel_gangway","mia_fender"],["mia_fender","evelyn_dock"],["evelyn_dock","owen_hatch"],["owen_hatch","zoey_drydock"],["zoey_drydock","chloe_ballast"],["chloe_ballast","john_windward"]],"ue":[["noah_mariner","liam_anchor",1],["liam_anchor","henry_sail",1],["henry_sail","james_stern",1],["james_stern","daniel_gangway",1],["daniel_gangway","mia_fender",1],["mia_fender","evelyn_dock",1],["evelyn_dock","owen_hatch",1],["owen_hatch","zoey_drydock",1],["zoey_drydock","chloe_ballast",1],["chloe_ballast","john_windward",1]]}};

// ===== D3 SETUP =====
const W=window.innerWidth,H=window.innerHeight;
const svg=d3.select("#graph"),g=svg.append("g"),defs=svg.append("defs");

// Arrow markers
[{n:"HiddenOrca",c:"#22d3ee"},{n:"MellowOtter",c:"#fbbf24"},{n:"SwiftWren",c:"#fb923c"}].forEach(({n,c})=>{
  defs.append("marker").attr("id","ma-"+n).attr("viewBox","0 0 10 10").attr("refX",22).attr("refY",5)
    .attr("markerWidth",5).attr("markerHeight",5).attr("orient","auto")
    .append("path").attr("d","M0 0L10 5L0 10z").attr("fill",c).attr("opacity",0.45);
});

svg.call(d3.zoom().scaleExtent([0.2,3]).on("zoom",e=>g.attr("transform",e.transform)));

// ===== BIGGER NODE SIZES =====
const RS={blind:16,puppet:20,core:26,endpoint:32};
const RC={blind:"#58a6ff",puppet:"#d29922",core:"#a371f7",endpoint:"#f85149"};
const RL={blind:"Blind Forwarder",puppet:"Privileged Puppet",core:"Core Operator",endpoint:"Post Endpoint"};

// ===== FORCE =====
const displayEdges=[];
Object.entries(CHAINS).forEach(([nm,c])=>{
  c.ue.forEach(e=>displayEdges.push({source:e[0],target:e[1],chain:nm,color:c.cl,w:e[2]}));
});

const sim=d3.forceSimulation(N)
  .force("link",d3.forceLink(displayEdges).id(d=>d.id).distance(90).strength(0.05))
  .force("charge",d3.forceManyBody().strength(d=>d.r==="core"?-650:d.r==="endpoint"?-900:d.r==="puppet"?-400:-200))
  .force("collide",d3.forceCollide(d=>RS[d.r]+8))
  .force("x",d3.forceX(d=>d.fx??d.px??0).strength(d=>d.fx!=null?0.25:d.px!=null?0.04:0.002))
  .force("y",d3.forceY(d=>d.fy??d.py??0).strength(d=>d.fy!=null?0.2:d.py!=null?0.03:0.002));

// ===== RENDER =====
const linkG=g.append("g"),nodeG=g.append("g"),partG=g.append("g");

// Edges: thickness by weight
const linkEls=linkG.selectAll("line").data(displayEdges).enter().append("line")
  .attr("stroke",d=>d.color+"44").attr("stroke-width",d=>1+Math.log(d.w+1)*1.6)
  .attr("marker-end",d=>'url(#ma-'+d.chain+')');

// Nodes
const nodeEls=nodeG.selectAll("g").data(N).enter().append("g").attr("cursor","pointer")
  .call(d3.drag().on("start",(e,d)=>{sim.alphaTarget(0.15).restart();d._fx=d.x;d._fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!d._pin){d.fx=null;d.fy=null;}sim.alphaTarget(0);}));
N.forEach(d=>{if(d.fx!=null)d._pin=true;});

// Outline ring
nodeEls.append("circle").attr("r",d=>RS[d.r]+5).attr("fill","none")
  .attr("stroke",d=>RC[d.r]).attr("stroke-width",1.5).attr("stroke-opacity",0.15);

// Main circle — big and clear, NO glow filter
nodeEls.append("circle").attr("class","mn").attr("r",d=>RS[d.r])
  .attr("fill",d=>RC[d.r]).attr("stroke","#fff").attr("stroke-width",2).attr("stroke-opacity",0.25);

// Label
nodeEls.append("text").text(d=>d.nm.split(" ").pop())
  .attr("dy",d=>RS[d.r]+14).attr("text-anchor","middle")
  .attr("fill","#c9d1d9").attr("font-size",d=>d.r==="core"||d.r==="endpoint"?12:10)
  .attr("font-weight",d=>d.r==="core"||d.r==="endpoint"?700:500);

// John special: red ring
const jG=nodeEls.filter(d=>d.id==="john_windward");
jG.append("circle").attr("r",RS.endpoint+8).attr("fill","none").attr("stroke","#f85149")
  .attr("stroke-width",3).attr("stroke-opacity",0.5);
(function breathe(){jG.selectAll("circle").filter((d,i)=>i===2).transition().duration(2000)
  .attr("r",RS.endpoint+16).attr("stroke-opacity",0.1).transition().duration(2000)
  .attr("r",RS.endpoint+8).attr("stroke-opacity",0.5).on("end",breathe);})();

// ===== SIM TICK =====
sim.on("tick",()=>{
  linkEls.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeEls.attr("transform",d=>`translate(${d.x},${d.y})`);
  if(sim.alpha()<0.015)sim.stop();
});

// ===== TOOLTIP =====
const tip=d3.select("#tip");
nodeEls.on("mouseenter",function(e,d){
  const con=new Set();displayEdges.forEach(l=>{if(l.source.id===d.id||l.target.id===d.id){con.add(l.source.id);con.add(l.target.id);}});con.add(d.id);
  nodeEls.selectAll("circle").transition().duration(200).attr("opacity",function(){return con.has(d3.select(this.parentNode).datum().id)?1:0.08;});
  linkEls.transition().duration(200).attr("stroke-opacity",l=>con.has(l.source.id)&&con.has(l.target.id)?0.7:0.01);
  tip.style("opacity",1).html(`<b style="color:${RC[d.r]}">${d.nm}</b><div class="dp">${d.dp} · ${d.hp} hops</div><span class="tag" style="background:${RC[d.r]}18;color:${RC[d.r]};border:1px solid ${RC[d.r]}33">${RL[d.r]}</span>`);
}).on("mousemove",e=>tip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-10)+"px"))
  .on("mouseleave",()=>{if(!ac){nodeEls.selectAll("circle").transition().duration(400).attr("opacity",1);linkEls.transition().duration(400).attr("stroke-opacity",0.35);}else hl(ac);tip.style("opacity",0);});

// ===== CHAIN SELECTION =====
let ac=null,timer=null,rafId=null,stopped=false,paused=false;

function hl(cn){
  linkEls.transition().duration(400).attr("stroke-opacity",l=>l.chain===cn?0.6:0.01).attr("stroke-width",l=>l.chain===cn?2+Math.log(l.w+1)*2:0.3);
  const sn=new Set();CHAINS[cn].ue.forEach(e=>{sn.add(e[0]);sn.add(e[1]);});
  nodeEls.selectAll("circle").transition().duration(400).attr("opacity",function(){return sn.has(d3.select(this.parentNode).datum().id)?1:0.1;});
}

function sel(cn){
  if(ac===cn){paused=!paused;if(!paused)run();return;}
  stopped=true;if(rafId){cancelAnimationFrame(rafId);rafId=null;}if(timer){clearTimeout(timer);timer=null;}
  partG.selectAll("*").remove();ac=cn;paused=false;
  document.querySelectorAll(".btn").forEach(b=>b.classList.remove("on"));
  document.getElementById("b"+cn.substring(0,2).toLowerCase()).classList.add("on");
  hl(cn);
  const c=CHAINS[cn];
  document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${cn}</b><br>${c.desc}<br>8s · ${c.total} hops`;
  run();
}

function run(){
  if(!ac||paused){rafId=null;return;}
  stopped=false;const c=CHAINS[ac];const totalMs=8000;
  const path=c.hops.map(([sId,tId])=>{
    const s=N.find(n=>n.id===sId),t=N.find(n=>n.id===tId);
    return {sx:s?.x||0,sy:s?.y||0,tx:t?.x||0,ty:t?.y||0,self:sId===tId,sId};
  });
  partG.selectAll("*").remove();
  const p=partG.append("circle").attr("r",5).attr("fill",c.cl).attr("opacity",0.9).attr("cx",path[0].sx).attr("cy",path[0].sy);
  const st=performance.now();
  (function frame(){
    if(stopped)return;
    const elapsed=performance.now()-st,prog=Math.min(elapsed/totalMs,1);
    const raw=prog*c.total,idx=Math.min(Math.floor(raw),c.total-1),hp=raw-idx;
    const seg=path[idx];
    if(seg){p.attr("cx",seg.self?seg.sx:seg.sx+(seg.tx-seg.sx)*hp).attr("cy",seg.self?seg.sy:seg.sy+(seg.ty-seg.sy)*hp);}
    document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${ac}</b><br>${idx+1}/${c.total}${seg?.self?' [self]':' → '+(seg?N.find(n=>n.id===seg.sId)?.nm.split(' ').pop():'')}`;
    if(prog>=1){
      const jn=N.find(n=>n.id==="john_windward");if(jn)rip(jn,c.cl);
      document.getElementById("sts").innerHTML=`<b style="color:${c.cl}">${ac}</b><br>✓ Posted to SaidIt`;
      if(!stopped)timer=setTimeout(()=>{if(!stopped)run();},2200);return;
    }
    if(!stopped)rafId=requestAnimationFrame(frame);
  })();
  rafId=requestAnimationFrame(frame);
}

function rip(node,color){
  for(let i=0;i<3;i++)g.append("circle").attr("cx",node.x).attr("cy",node.y).attr("r",RS[node.r]).attr("fill","none").attr("stroke",color).attr("stroke-width",3-i*0.8).attr("stroke-opacity",0.7).attr("pointer-events","none").transition().duration(800+i*200).attr("r",RS[node.r]+50+i*20).attr("stroke-opacity",0).remove();
  nodeEls.filter(d=>d.id===node.id).selectAll("circle").filter((d,i)=>i===1).transition().duration(100).attr("r",RS[node.r]*1.4).attr("fill","#fff").transition().duration(400).attr("r",RS[node.r]).attr("fill",RC[node.r]);
}

svg.call(d3.zoom().transform,d3.zoomIdentity.translate(W/2,H/2));
</script>
