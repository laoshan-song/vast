name: Deploy MC2 submission

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare submission site
        shell: bash
        run: |
          mkdir -p _site/VAST_Challenge_2026_MC2
          cp .github/pages-index.html _site/index.html
          cp VAST_Challenge_2026_MC2/index.htm _site/VAST_Challenge_2026_MC2/index.htm
          cp VAST_Challenge_2026_MC2/index_zh.htm _site/VAST_Challenge_2026_MC2/index_zh.htm
          cp -R VAST_Challenge_2026_MC2/rebuild _site/VAST_Challenge_2026_MC2/rebuild
          touch _site/.nojekyll

      - name: Upload submission site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
